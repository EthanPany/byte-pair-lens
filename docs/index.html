/* Fonts come from this site's own host, so they are reachable wherever the page is. font-display:fallback
   plus the 1.5 s cap in boot() mean a slow or blocked font file never holds the page: the system fonts in
   the stacks below take over, and a font that arrives late does not re-flow the page.
   Self-hosted fonts: Bree Serif for the title only, IBM Plex Sans for the interface, IBM Plex Mono only for bytes and numbers in tables.
   Characters of other scripts fall back to the system fonts. */
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:fallback;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:fallback;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:fallback;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bree Serif";font-weight:400;font-display:fallback;src:url(fonts/bree-serif-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:fallback;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:fallback;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
/* Ink on paper: black and white chrome, hairline rules, square corners. Colour only carries meaning:
   blue = one whole token, grey = split into bytes, vermilion = a byte fragment. */
:root{
  --bg:#ffffff;--fg:#111111;--muted:#5c5c5c;--line:#d9d9d9;--tint:#f3f3f3;
  --tok-1:#dbe7fd;--tok-2:#d9f2e1;--tok-3:#fcefc7;--tok-4:#fbe0ec;--tok-5:#e8e2fb;--tok-edge:rgba(17,17,17,.14);
  --frag:#d6400f;--frag-ink:#ffffff;--whole:#2f5fd8;--split:#dcdcdc;
  --sans-base:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,"Helvetica Neue",Arial,sans-serif;
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,"Helvetica Neue",Arial,sans-serif,"BPL Fallback";
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;--cjk:var(--sans);
  --h:34px; /* one control height everywhere */
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;padding:28px max(20px,env(safe-area-inset-right,0px)) 96px max(20px,env(safe-area-inset-left,0px))}
.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.wrap>*,section,[role=tabpanel]>*{min-width:0}
[role=tabpanel]{display:grid;grid-template-columns:minmax(0,1fr);gap:44px;padding-top:6px}
h1{font-family:"Bree Serif",Georgia,serif;font-weight:400;font-size:2.1rem;line-height:1.15;margin:0 0 2px}
h1 .tofu{display:inline-block;width:.62em;height:.74em;border:.085em solid currentColor;box-sizing:border-box;margin:0 .07em 0 .05em;vertical-align:baseline} /* the missing-glyph box that gives the tool its name */
h2{font-size:1.05rem;font-weight:600;margin:0 0 12px}
h2 small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
p{margin:0;max-width:70ch}
.sub{color:var(--muted);font-size:.92rem}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* every chip, pill and button shares one shape */
.chip,.btn,.pills button,.scriptchips button,.samples button,.pager button,.chips label{display:inline-flex;align-items:center;gap:7px;min-height:var(--h);padding:0 11px;font-size:.88rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s,color .12s}
.chip:hover,.btn:hover,.pills button:hover,.scriptchips button:hover,.samples button:hover,.pager button:hover:not(:disabled),.chips label:hover{border-color:var(--fg)}
.chip[aria-checked="true"],.pills button[aria-checked="true"],.scriptchips button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
/* tokenizer picker: a rail of chips, mirrored by a floating dock once the rail scrolls away */
.rail,.dockrail{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip .meta{display:none;font-family:var(--mono);font-size:.72rem;opacity:.7}
.chip[aria-checked="true"] .meta{display:inline}
.gsep{align-self:center;width:1px;height:18px;background:var(--line);margin:0 3px}
.chip.own{border-style:dashed;color:var(--muted)}
.chip.own:hover{color:var(--fg)}
.chip.busy{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.logo{width:16px;height:16px;flex:none;fill:currentColor}
.logo.badge{width:auto;height:auto;font:600 .58rem/1 var(--mono);letter-spacing:.02em;border:1px solid currentColor;padding:2px 3px}
.note{font-size:.85rem;color:var(--muted);min-height:0}
.note:empty{display:none}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 2*max(16px,env(safe-area-inset-left,0px)));background:var(--bg);border:1px solid var(--fg);box-shadow:0 6px 24px rgba(17,17,17,.12);padding:6px;transform:translate(-50%,0);transition:transform .25s ease,opacity .25s ease}
.dock[data-state="hidden"]{transform:translate(-50%,calc(100% + 40px));opacity:0;pointer-events:none}
.dockrail{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.dockrail .chip .meta{display:none}
.dockbtn,.dockpill{background:var(--bg);color:var(--fg);border:1px solid var(--line);cursor:pointer;min-height:var(--h);padding:0 10px}
.dockbtn:hover,.dockpill:hover{border-color:var(--fg)}
.dockpill{display:none;align-items:center;gap:8px;font-size:.88rem;border:0}
.dock[data-state="pill"]{padding:4px}
.dock[data-state="pill"] .dockrail,.dock[data-state="pill"] .dockbtn{display:none}
.dock[data-state="pill"] .dockpill{display:inline-flex}
@media (max-width:760px){.dockrail{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent);padding-right:24px}}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:.98rem;background:none;border:0;border-bottom:2px solid transparent;padding:8px 0;color:var(--muted);cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.ti{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1}
.ti [fill]{stroke:none}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
textarea{width:100%;min-height:92px;font-size:1rem;line-height:1.6;background:var(--bg);border:1px solid var(--line);padding:11px 13px;resize:vertical}
textarea:focus,input[type=search]:focus,select:focus{border-color:var(--fg);outline:0}
input[type=search],select{height:var(--h);font-size:.88rem;background:var(--bg);border:1px solid var(--line);padding:0 10px}
input[type=search]{flex:1;min-width:160px}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:16px;font-variant-numeric:tabular-nums}
.stats b{font-weight:600;color:var(--fg);font-size:1.15rem;margin-left:5px}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tok{padding:4px 8px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-width:0}
.tok.t1{background:var(--tok-1)}.tok.t2{background:var(--tok-2)}.tok.t3{background:var(--tok-3)}.tok.t4{background:var(--tok-4)}.tok.t5{background:var(--tok-5)}
.tok[class*=" t"]{border-color:var(--tok-edge)}
.tok .t{font-size:1.2rem;white-space:pre}
.tok .b{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.tok.frag{background:var(--frag);border-color:var(--frag)}
.tok.frag .t{color:var(--frag-ink);font-family:var(--mono);font-size:.95rem}
.tok.frag .b{color:var(--frag-ink);opacity:.85}
.legend,.mlegend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.legend{margin-top:12px}
.legend span::before,.mlegend span::before{content:"";display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.legend .f::before{background:var(--frag)}
.legend .w::before{background:linear-gradient(90deg,var(--tok-1) 0 33%,var(--tok-2) 33% 66%,var(--tok-3) 66%);outline:1px solid var(--tok-edge);outline-offset:-1px}
.mlegend .whole::before{background:var(--whole)}
.mlegend .none::before{background:var(--split)}
.mlegend .empty::before{background:var(--bg);outline:1px dashed #bbb;outline-offset:-1px}
.mlegend .empty.blank::before{outline:0;width:0;margin:0}
.mlegend .cumall::before{background:var(--muted);height:2px;vertical-align:3px}
.mlegend .tip{color:var(--fg)}
.mlegend .tip::before{display:none}
.samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.samples button{color:var(--muted)}
.samples button:hover{color:var(--fg)}
.bars{display:grid;gap:3px;font-size:.86rem;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:minmax(140px,220px) 1fr 124px;align-items:center;gap:10px;cursor:pointer;padding:4px;border:0;background:none;text-align:left}
.bar:hover,.bar[aria-pressed="true"]{background:var(--tint)}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar[aria-pressed="true"] .lab{font-weight:600}
.bar .rail{display:block;height:10px;background:var(--line);overflow:hidden;min-width:0}
.bar .fill{display:block;height:100%;background:var(--fg);transition:width .3s}
.bar[data-cat="1"] .fill{background:var(--frag)}
.bar .n{text-align:right;color:var(--muted);font-family:var(--mono);font-size:.78rem}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbl{overflow-x:auto;border-top:1px solid var(--fg)}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 14px 8px 0;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.8rem}
td.txt{font-size:1.05rem}
td.hex,td.cat{color:var(--muted)}
td.hex,td.num,.mono{font-family:var(--mono);font-size:.82rem}
.inv{background:var(--frag);color:var(--frag-ink);padding:0 4px;font-family:var(--mono);font-size:.82rem}
.pager{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:.88rem;color:var(--muted)}
.pager button:disabled{opacity:.35;cursor:default}
.loading{font-size:.88rem;color:var(--muted)}
.panel{border-top:1px solid var(--fg);padding-top:14px;min-width:0}
#bars{max-width:820px}
@media (max-width:760px){.bar{grid-template-columns:minmax(90px,120px) 1fr 96px}}
.ws{opacity:.5}
.num{font-weight:600;color:var(--fg)}
/* byte map */
.headline{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:14px}
.headline .big{font-size:2.5rem;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--whole)}
.headline .say{font-size:1.1rem}
.headline .say b{font-weight:600}
.headline .more{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums;margin-left:auto}
.headline .more b{color:var(--fg);font-weight:600}
.mapnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.scriptchips{display:contents}
.maplegend input{flex:0 1 240px;min-width:170px;margin-left:auto}
.mapscroll{overflow:auto;border:1px solid var(--line);background:var(--bg);position:relative}
.mapscroll.block{max-height:74vh}
.mapscroll canvas{display:block;cursor:crosshair}
.mapscroll.over canvas{cursor:zoom-in}
.mlegend.maplegend{margin-bottom:10px}
.mlegend .fragrow::before{width:3px;background:var(--frag)}
.viewseg{margin:0 0 0 auto;gap:0}
.zoomseg:not([hidden])+.viewseg{margin-left:0}
.zoomseg button{min-width:var(--h);justify-content:center;font-size:1.05rem}
.fbbar{height:3px;margin-bottom:2px;background:transparent;overflow:hidden}.fbbar i{display:block;height:100%;width:0;background:var(--fg);transition:width .25s}.fbbar:not(.on) i{opacity:0}
.viewseg button+button{margin-left:-1px}
.viewseg:not([hidden])+input{margin-left:0}
/* Detailed view: the block map as in the paper's figure, with the detail in a panel beside it */
.mapwrap.side{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:start}
.mapwrap.side .detail{position:sticky;top:12px;width:auto;border:0;box-shadow:none;padding:0;pointer-events:auto;z-index:auto}
.mapwrap.side .detail .big{font-size:4.5rem;padding:10px 0 16px}
.mapwrap.side .detail dd.plain{font-family:var(--mono);font-size:.8rem}
.mapwrap.side .detail .split span{font-family:var(--mono)}
.mapwrap.side .detail .split small{opacity:.7;margin-left:4px}
@media (max-width:760px){.mapwrap.side{grid-template-columns:minmax(0,1fr)}.mapwrap.side .detail{position:static}}
.detail{position:fixed;z-index:30;width:260px;background:var(--bg);border:1px solid var(--fg);box-shadow:0 8px 28px rgba(17,17,17,.16);padding:12px 14px;font-size:.86rem;display:grid;gap:8px;pointer-events:none}
.detail.pinned{pointer-events:auto}
.detail .big{font-size:3.4rem;line-height:1.1;text-align:center;padding:4px 0 10px;border-bottom:1px solid var(--line);overflow:hidden}
.detail .big.sm{font-size:1.5rem;letter-spacing:.12em;padding:10px 0 12px}
.detail .big.kind{font-size:.95rem;color:var(--muted);padding:18px 0}
.nog{display:inline-block;vertical-align:middle;font:500 .34em/1.2 var(--mono);letter-spacing:.04em;color:var(--muted);border:1px dashed var(--muted);padding:.3em .45em;margin:0 .15em;text-align:center}
.detail .big.sm .nog{font-size:.5em}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere;font-family:var(--mono);font-size:.8rem;align-self:center}
.detail dd.plain{font-family:var(--sans);font-size:.86rem}
.detail .split{display:flex;gap:4px;flex-wrap:wrap}
.detail .split span{padding:1px 5px;background:var(--tok-1);border:1px solid var(--tok-edge);font-family:var(--sans)}
.detail .split span.frag{background:var(--frag);border-color:var(--frag);color:var(--frag-ink);font-family:var(--mono)}
.detail .foot{color:var(--muted);font-size:.8rem}
/* coverage */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.covtbl th{cursor:pointer}
.covtbl th[aria-sort]::after{content:" ↓"}
.covtbl td.v{text-align:right;cursor:pointer;min-width:72px;border-left:2px solid var(--bg);font-family:var(--mono);font-size:.82rem}
.covtbl td.v:hover{outline:2px solid var(--fg);outline-offset:-2px}

.covfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.btn{border-color:var(--fg)}
.btn:hover{background:var(--fg);color:var(--bg)}
.covsum{font-size:1rem;max-width:80ch;margin:10px 0 12px}

.covtip table{border-collapse:collapse;margin-top:3px}.covtip td,.covtip th{padding:1px 10px 1px 0;text-align:left;font-weight:400}.covtip th{color:var(--muted);font-size:.72rem}

<script>
(function(){
const $=s=>document.querySelector(s);
const TOKCOL=['t1','t2','t3','t4','t5'];
const cache={}; let V=null, curEnc='cl100k_base', booted=false, tokDirty=true;
const encU=new TextEncoder();

const hex=BPE.hex;
function mb(n){return (n/1048576).toFixed(1)+' MB';}

/* ---- Loading veil ----
   The page blurs under a progress card while data downloads or a vocabulary is being built, so nothing
   is ever shown half-ready. Several downloads share one bar. A failed load offers "Try again". */
const Loader=(function(){
  const jobs=new Map(); let showT=null, failed=false, holds=0;
  const veil=$('#veil'), card=$('#veilcard');
  function paint(){
    if(failed)return;
    const js=[...jobs.values()];
    // a quiet job (a vocabulary loading behind an already drawn map) shows only while something waits on it
    if(!holds&&!js.some(j=>!j.quiet)){clearTimeout(showT);showT=null;veil.dataset.on='0';return;} let got=0,total=0,prep=true;
    for(const j of js){total+=j.total;got+=Math.min(j.got,j.total);if(!j.prep)prep=false;}
    const local=js.length&&js.every(j=>j.local);
    if(js.length)$('#veilwhat').textContent=(local?'Opening ':'Loading ')+(js.length===1?js[0].label:`${js.length} tokenizers`);
    $('#veilfill').style.width=(js.length?(total?100*got/total:0):100).toFixed(1)+'%';
    $('#veilhow').textContent=local?'Saved on this device':!js.length||prep?'Preparing…':total&&got?`${mb(got)} of ${mb(total)}`:'';
    if(veil.dataset.on!=='1'&&!showT)showT=setTimeout(()=>{showT=null;if(holds||[...jobs.values()].some(j=>!j.quiet))veil.dataset.on='1';},150);
  }
  return {
    start(id,label,total,quiet){const j=jobs.get(id)||{got:0};jobs.set(id,{...j,label,total:total||0,quiet:!!quiet});paint();},
    update(id,got){const j=jobs.get(id);if(j){j.got=got;paint();}},
    prep(id){const j=jobs.get(id);if(j){j.got=j.total;j.prep=true;paint();}},
    local(id){const j=jobs.get(id);if(j){j.local=true;j.got=j.total;paint();}},
    end(id){jobs.delete(id);paint();},
    busy(){return jobs.size>0||holds>0;},
    hold(){holds++;paint();},
    release(){holds=Math.max(0,holds-1);paint();},
    fail(msg,retry){
      failed=true;jobs.clear();holds=0;card.classList.add('err');
      $('#veilwhat').textContent='Could not load';$('#veilhow').textContent=msg;
      const b=$('#veilretry');b.hidden=false;
      b.onclick=()=>{failed=false;card.classList.remove('err');b.hidden=true;veil.dataset.on='0';retry();};
      clearTimeout(showT);showT=null;veil.dataset.on='1';
    },
  };
})();

/* ---- Data loading ----
   manifest.json lists a content hash per data file (scripts/build_manifest.py). Files are fetched as
   name?v=hash and kept in Cache Storage, so repeat visits read them from disk with no request, and a
   new page can never be paired with an old vocabulary file. Falls back to plain fetch where the
   Cache API is unavailable (file://, some private windows). */
const DATA_CACHE='bpl-data-v1';
let manifestP=null;
function manifest(){
  if(!manifestP)manifestP=fetch('manifest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(m=>{try{localStorage.setItem('bpl-manifest',JSON.stringify(m));}catch(e){}return m;})
    .catch(()=>{try{return JSON.parse(localStorage.getItem('bpl-manifest'))||{files:{}};}catch(e){return {files:{}};}}); // offline: the last manifest still matches the saved files
  return manifestP;
}
async function dataURL(name){const m=await manifest();const f=m.files[name];return f?`${name}?v=${f.v}`:name;}
// fetch a data file, from Cache Storage when we have this version; onBytes(n) reports progress
const CACHED=Symbol('cached'); // getData(..., true): the file is in Cache Storage, not parsed here
async function getData(name,onBytes,ensureOnly){
  const url=await dataURL(name);
  if(prefetching[url])await prefetching[url]; // already on its way in the background: wait for it instead of downloading twice
  let store=null;
  try{store=await caches.open(DATA_CACHE);const hit=await store.match(url);if(hit){onBytes&&onBytes(Infinity);return ensureOnly?CACHED:hit.json();}}catch(e){store=null;}
  const r=await fetch(url); if(!r.ok)throw new Error(name+': HTTP '+r.status);
  let body;
  if(onBytes&&r.body){ // count decompressed bytes as they arrive
    const reader=r.body.getReader(), parts=[]; let n=0;
    for(;;){const {done,value}=await reader.read(); if(done)break; parts.push(value); n+=value.length; onBytes(n);}
    body=new Blob(parts,{type:'application/json'});
  }else body=await r.blob();
  let kept=false;
  if(store){
    try{
      await store.put(url,new Response(body,{headers:{'Content-Type':'application/json'}})); kept=true;
      for(const k of await store.keys()){const u=new URL(k.url);if(u.pathname.endsWith('/'+name)&&!k.url.endsWith(url))store.delete(k);} // drop older versions
    }catch(e){}
  }
  return ensureOnly&&kept?CACHED:JSON.parse(await body.text());
}
// Tokenizers already saved on this device (Cache Storage). They open without a download.
const saved=new Set();
async function refreshSaved(){
  try{
    const m=await manifest(), store=await caches.open(DATA_CACHE);
    const has=async f=>!m.files[f]||!!(await store.match(`${f}?v=${m.files[f].v}`)); // matched by full URL, so another copy of the site on the same host doesn't count
    const found=new Set();
    for(const o of $('#encsel').options){const e=o.value;if(m.files[e+'.json']&&await has(e+'.json')&&await has(e+'.merges.json'))found.add(e);}
    saved.clear(); found.forEach(e=>saved.add(e));
  }catch(e){}
  if(navigator.storage&&navigator.storage.persist&&saved.size&&!/Firefox/.test(navigator.userAgent))navigator.storage.persist().catch(()=>{}); // ask the browser not to evict them
}
/* Background prefetch: once the page is showing, quietly save the other tokenizers to this device,
   smallest first, one at a time, so later switches skip the download. It never blocks the page: it waits
   while anything is loading in the foreground, and it does not run on metered or slow connections or
   when storage is short. Only bytes are saved; a vocabulary is still built when it is first opened. */
const prefetching={};
async function prefetchOne(name){
  const url=await dataURL(name), store=await caches.open(DATA_CACHE);
  if(await store.match(url))return;
  const job=(async()=>{
    const r=await fetch(url,{priority:'low'}); if(!r.ok)throw new Error('HTTP '+r.status);
    await store.put(url,r);
    for(const k of await store.keys()){const u=new URL(k.url);if(u.pathname.endsWith('/'+name)&&!k.url.endsWith(url))store.delete(k);}
  })();
  prefetching[url]=job.catch(()=>{});
  try{await job;}finally{delete prefetching[url];}
}
async function prefetchRest(){
  try{
    if(!('caches' in window))return;
    const c=navigator.connection||{};
    if(c.saveData||c.type==='cellular'||/(^|-)2g$/.test(c.effectiveType||''))return;
    const m=await manifest(); await refreshSaved();
    const size=f=>(m.files[f]||{}).size||0;
    const todo=[...$('#encsel').options].map(o=>o.value).filter(e=>m.files[e+'.json']&&!saved.has(e))
      .map(e=>({e,files:[e+'.json',e+'.merges.json'].filter(f=>m.files[f])}))
      .map(t=>({...t,bytes:t.files.reduce((a,f)=>a+size(f),0)})).sort((a,b)=>a.bytes-b.bytes);
    if(navigator.storage&&navigator.storage.estimate){
      const {quota=0,usage=0}=await navigator.storage.estimate();
      if(quota-usage<3*todo.reduce((a,t)=>a+t.bytes,0)+50e6)return; // keep well clear of the browser's limit
    }
    for(const f of ['coverage.json','freq.json'])if(m.files[f])await prefetchOne(f).catch(()=>{});
    for(const t of todo){
      while(Loader.busy()||document.hidden)await new Promise(r=>setTimeout(r,700));
      if(saved.has(t.e))continue;
      try{for(const f of t.files)await prefetchOne(f);saved.add(t.e);renderPickers();}catch(e){return;} // offline or blocked: stop quietly
    }
  }catch(e){}
}
// one in-flight promise per tokenizer, so the Tokenizer and Compare tabs never download twice
/* Building a vocabulary (parsing megabytes of JSON, decoding every token) happens in a Web Worker: the
   same bpe.js, loaded as a worker, reads the file from Cache Storage and sends back flat tables that
   BPE.unpack() only has to index. Without workers or Cache Storage it is built here instead.
   scripts/check_pack.cjs checks both routes give the same vocabulary. */
const ready={}; // enc -> built vocabulary, once load(enc) has finished
const bpeSrc=document.querySelector('script[src^="bpe.js"]').src;
let worker=null, workerOff=!window.Worker, wid=0; const wjobs=new Map();
function inWorker(msg){
  return new Promise((res,rej)=>{
    try{
      if(!worker){
        worker=new Worker(bpeSrc);
        worker.onmessage=ev=>{const j=wjobs.get(ev.data.id);if(!j)return;wjobs.delete(ev.data.id);ev.data.error?j.rej(new Error(ev.data.error)):j.res(ev.data);};
        worker.onerror=()=>{workerOff=true;for(const j of wjobs.values())j.rej(new Error('worker failed'));wjobs.clear();worker=null;};
      }
      const id=++wid; wjobs.set(id,{res,rej}); worker.postMessage({id,...msg});
    }catch(e){workerOff=true;rej(e);}
  });
}
function load(enc){
  if(!cache[enc])cache[enc]=loadNow(enc).catch(e=>{delete cache[enc];throw e;});
  return cache[enc];
}
async function loadNow(enc){
  const label=(SHORT[enc]||[([...$('#encsel').options].find(o=>o.value===enc)?.textContent||enc).split(' · ')[0]])[0];
  Loader.start(enc,label,0,true);
  try{
    const m=await manifest();
    const files=[enc+'.json'], sp=m.files[enc+'.merges.json']; if(sp)files.push(enc+'.merges.json');
    const size=f=>(m.files[f]||{}).size||0, got={}, hit=new Set();
    Loader.start(enc,label,files.reduce((a,f)=>a+size(f),0),true);
    // vocabulary and merges download in parallel, straight into Cache Storage
    const have=await Promise.all(files.map(f=>getData(f,n=>{if(n===Infinity){hit.add(f);if(hit.size===files.length)Loader.local(enc);}got[f]=Math.min(n,size(f)||n);Loader.update(enc,files.reduce((a,x)=>a+(got[x]||0),0));},true)));
    Loader.prep(enc);
    let v=null;
    if(!workerOff&&have.every(x=>x===CACHED)){
      try{
        const abs=async f=>new URL(await dataURL(f),location.href).href;
        const r=await inWorker({cacheName:DATA_CACHE,vocab:await abs(files[0]),merges:files[1]?await abs(files[1]):null});
        v=BPE.unpack(r.P); if(r.merges)v.setMerges(r.merges);
      }catch(e){v=null;}
    }
    if(!v){
      const [j,merges]=await Promise.all(files.map((f,i)=>have[i]===CACHED?getData(f):have[i]));
      await new Promise(r=>setTimeout(r,30)); // let the card paint before the synchronous build
      v=BPE.load(j); if(v.kind==='sp')v.setMerges(merges);
    }
    if(v.kind==='sp')(window.requestIdleCallback||setTimeout)(()=>{void v.mergeRank;}); // index the merges when idle
    saved.add(enc); ready[enc]=v;
    return v;
  }finally{Loader.end(enc);}
}

async function switchEnc(enc){
  const seq=++switchSeq; booted=true; curEnc=enc; V=ready[enc]||null; $('#encsel').value=enc; renderPickers();
  const lite=!!bitsFor(enc);
  if(lite){drawMap();showPinned();}
  writeHash();
  const blocking=!V&&(!lite||currentTab()!=='map'); if(blocking)Loader.hold();
  try{
    if(!V){const v=await load(enc); if(seq!==switchSeq)return; V=v;}
    if(!lite){drawMap();showPinned();}
    renderV();
    if(!$('#pane-cov').hidden)await renderCoverage();
    if(!$('#pane-cmp').hidden)renderCompare();
    if(blocking)await new Promise(r=>requestAnimationFrame(()=>setTimeout(r)));
  }finally{if(blocking)Loader.release();}
}
$('#input').addEventListener('input',render);
$('#samples').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#input').value=b.dataset.s;render();});
$('#encsel').addEventListener('change',e=>{if(e.target.value==='__upload'){e.target.value=curEnc;$('#ownfile').click();return;}pickEnc(e.target.value);});
$('#q').addEventListener('input',()=>{page=0;renderTable();});
$('#catsel').addEventListener('change',()=>{page=0;renderTable();});
$('#sort').addEventListener('change',()=>{page=0;renderTable();});
$('#prev').onclick=()=>{page--;renderTable();};
$('#next').onclick=()=>{page++;renderTable();};
renderPickers();
const H=readHash(); const startEnc=[...$('#encsel').options].some(o=>o.value===H.enc)?H.enc:'cl100k_base';
// First paint: the bitmaps (one small file) and the fonts. The vocabulary loads behind the drawn map.
(function boot(){
  Loader.hold();
  const fonts=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
  const start=()=>{const p=switchEnc(startEnc);p.then(()=>setTimeout(prefetchRest,1200),e=>Loader.fail(e.message,start));return p;};
  getData('whole.json').then(w=>{WHOLE=w;},()=>{}).then(async()=>{
    const p=start();
    await fonts;
    if(!(bitsFor(startEnc)&&currentTab()==='map'))await p.catch(()=>{}); // no bitmap, or a tab that needs the vocabulary: wait for it
    drawMap(); Loader.release();
    getData('fallback.json').then(j=>{Fallback.init(j);Fallback.watch(document.body);Fallback.need(Fallback.cpsOf(document.body.textContent));if(currentTab()==='map')drawMap();}).catch(e=>console.warn('fallback fonts',e));
  });
})();
})();
</script>
